[workspace]
resolver = "3"
members = ["crates/core", "crates/daemon", "crates/ui", "frontend"]
# The frontend only makes sense as WASM (built by Trunk), so a plain
# `cargo build` at the root skips it.
default-members = ["crates/core", "crates/daemon", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/incept0s/andromeda"

[workspace.dependencies]
andromeda-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
zbus = { version = "6.3", default-features = false, features = ["tokio", "proxy", "service"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
