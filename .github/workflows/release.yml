# Builds the RPM in a Fedora container when a version tag is pushed
# (e.g. v0.1.0) and attaches it to the GitHub Release. Bump `version` in
# Cargo.toml before tagging: the RPM takes its version from there.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git tar gzip gcc rpm-build systemd-rpm-macros \
            rust cargo rust-std-static-wasm32-unknown-unknown \
            webkit2gtk4.1-devel gtk3-devel libsoup3-devel openssl-devel pulseaudio-libs-devel

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            target
          key: fedora44-${{ hashFiles('Cargo.lock') }}

      - name: Install Trunk
        run: command -v trunk || cargo install trunk --locked
        env:
          PATH: /github/home/.cargo/bin:/usr/local/bin:/usr/bin:/bin

      # The RPM build runs trunk first; the UI crate embeds frontend/dist at
      # compile time, so tests come after it.
      - name: Build RPM
        run: scripts/build-rpm.sh
        env:
          PATH: /github/home/.cargo/bin:/usr/local/bin:/usr/bin:/bin

      - name: Test
        run: cargo test --locked --workspace --exclude andromeda-frontend

      - uses: softprops/action-gh-release@v2
        with:
          files: target/rpm/RPMS/x86_64/*.rpm
