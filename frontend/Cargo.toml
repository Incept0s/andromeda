[package]
name = "andromeda-frontend"
description = "Andromeda panel frontend (Leptos, compiled to WASM by Trunk)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
andromeda-core.workspace = true
leptos = { version = "0.8.23", features = ["csr"] }
serde.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DragEvent"] }
