[package]
name = "andromedad"
description = "Andromeda background daemon: sensors, alerts and the D-Bus service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
andromeda-core.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
libc = "0.2"
zbus.workspace = true
nvml-wrapper = "0.13"
toml = "1"
serde_json = "1"
libpulse-binding = "2.30"
futures-util = { version = "0.3", default-features = false }
png = "0.18"
rqrr = "0.11"
serde = { workspace = true }
