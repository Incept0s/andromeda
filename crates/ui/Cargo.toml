[package]
name = "andromeda"
description = "Andromeda panel UI (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
andromeda-core.workspace = true
zbus.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["time", "macros"] }
serde.workspace = true
serde_json = "1"
# Only to watch the webview's own GTK drag signals (same versions as Tauri's).
gtk = "0.18"
webkit2gtk = "2.0"
